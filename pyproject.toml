[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

"src/guard/negation.py" = ["B005"]
"src/tool/knowledge.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = [
    "src",
    "evaluation",
]

[tool.pytest.ini_options]
markers = [
    "slow: tests that require real external services",
    "integration: tests that exercise multiple application components",
]
