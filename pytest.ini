[pytest]
markers =
    unit: narrow unit tests without cross-process or external boundaries
    contract: behavior contracts shared by Fake and real implementations
    integration: zero-network integration tests across multiple local components
    e2e: zero-network end-to-end tests from entry point to result
    live_llm: M0 requires a real DeepSeek API smoke test
    live_tool: M3 requires a real tool contract smoke test
    live_e2e: M4 requires a real end-to-end vertical slice
    slow: real API or explicitly time-consuming tests, excluded by default
addopts = -m "not slow"
testpaths = tests
